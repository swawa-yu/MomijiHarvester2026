name: Create guarded momiji2 data update

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Select a no-crawl consumer check or the complete update
        required: true
        default: consumer-preflight
        type: choice
        options:
          - consumer-preflight
          - full
      target_year:
        description: Required for full mode (4-digit academic year)
        required: false
        type: string
      update_kind:
        description: Select a same-year update or a one-year rollover
        required: true
        default: same-year
        type: choice
        options:
          - same-year
          - year-rollover

permissions:
  contents: read

concurrency:
  group: harvester-to-momiji2-update
  cancel-in-progress: false

jobs:
  update-consumer:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and test Harvester
        run: |
          python -m pip install --upgrade pip uv flake8
          uv venv
          uv pip install -r requirements.txt
          PYTHONPATH=. uv run pytest -q
          uv run flake8 scripts/resolve_generation_artifacts.py \
            scripts/validate_target_year.py \
            scripts/validate_consumer_update_diff.py \
            tests/test_generation_artifacts.py \
            tests/test_validate_target_year.py

      - name: Clone the public consumer integration branch
        run: |
          git clone --branch develop \
            https://github.com/swawa-yu/momiji2.git "$RUNNER_TEMP/momiji2"

      - name: Verify the target year transition
        if: inputs.mode == 'full'
        env:
          UPDATE_KIND: ${{ inputs.update_kind }}
          TARGET_YEAR: ${{ inputs.target_year }}
        run: |
          python scripts/validate_target_year.py \
            --update-kind "$UPDATE_KIND" \
            --target-year "$TARGET_YEAR" \
            --manifest "$RUNNER_TEMP/momiji2/data/subjectDataManifest.json"

      - name: Crawl the complete Japanese syllabus
        if: inputs.mode == 'full'
        id: crawl
        env:
          TARGET_YEAR: ${{ inputs.target_year }}
        run: |
          output_dir="$RUNNER_TEMP/harvester-output"
          mkdir "$output_dir"
          uv run python -m src.main run \
            --target-year "$TARGET_YEAR" \
            --output-dir "$output_dir" \
            --max-subjects 0
          python scripts/resolve_generation_artifacts.py \
            --output-dir "$output_dir" \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Node and consumer dependencies
        working-directory: ${{ runner.temp }}/momiji2
        run: |
          npm install -g pnpm@8.12.1
          pnpm install --frozen-lockfile

      - name: Validate the active consumer baseline
        working-directory: ${{ runner.temp }}/momiji2
        run: |
          pnpm validate:data
          pnpm check:subject-constants
          pnpm exec tsc --noEmit
          pnpm prebuild

      - name: Complete the no-crawl consumer preflight
        if: inputs.mode == 'consumer-preflight'
        run: |
          echo "Consumer preflight passed without crawling or creating a pull request."

      - name: Determine deterministic target branch
        if: inputs.mode == 'full'
        id: target
        env:
          YEAR: ${{ steps.crawl.outputs.year }}
          SHA256: ${{ steps.crawl.outputs.data_sha256 }}
          STRUCTURE_SHA256: ${{ steps.crawl.outputs.structure_sha256 }}
        run: |
          branch="automation/harvester-${YEAR}-${SHA256:0:8}-${STRUCTURE_SHA256:0:8}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads \
            https://github.com/swawa-yu/momiji2.git "refs/heads/$branch"; then
            echo "branch_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop when consumer already has this exact generation
        if: inputs.mode == 'full'
        id: current
        working-directory: ${{ runner.temp }}/momiji2
        env:
          DATA_FILE: ${{ steps.crawl.outputs.data_file }}
          DATA_SHA256: ${{ steps.crawl.outputs.data_sha256 }}
          STRUCTURE_SHA256: ${{ steps.crawl.outputs.structure_sha256 }}
        run: |
          if python - "$DATA_FILE" "$DATA_SHA256" "$STRUCTURE_SHA256" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          data_file, expected_sha256, expected_structure_sha256 = sys.argv[1:]
          manifest_path = Path("data/subjectDataManifest.json")
          data_path = Path("data") / data_file
          try:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              raise SystemExit(1)
          if manifest.get("dataFile") != data_file or not data_path.is_file():
              raise SystemExit(1)
          if hashlib.sha256(data_path.read_bytes()).hexdigest() != expected_sha256:
              raise SystemExit(1)
          structure_path = Path("data/subject_structure.json")
          if not structure_path.is_file():
              raise SystemExit(1)
          if hashlib.sha256(structure_path.read_bytes()).hexdigest() != expected_structure_sha256:
              raise SystemExit(1)
          PY
          then
            echo "already_current=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the Harvester generation and record analysis
        if: inputs.mode == 'full' && steps.current.outputs.already_current != 'true'
        working-directory: ${{ runner.temp }}/momiji2
        env:
          MANIFEST_PATH: ${{ steps.crawl.outputs.manifest_path }}
          DEPARTMENTS_PATH: ${{ steps.crawl.outputs.departments_path }}
          GUARD_REPORT_PATH: ${{ runner.temp }}/update-guard-report.json
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { importHarvesterGeneration } from './scripts/import-harvester-generation.mjs';

          const result = await importHarvesterGeneration({
            manifestPath: process.env.MANIFEST_PATH,
            departmentsPath: process.env.DEPARTMENTS_PATH,
            check: true,
          });
          if (result.guardReport.hardFailures.length || result.guardReport.review.length) {
            throw new Error(`Update guard did not clear: ${JSON.stringify(result.guardReport)}`);
          }
          await fs.writeFile(
            process.env.GUARD_REPORT_PATH,
            `${JSON.stringify(result.guardReport, null, 2)}\n`,
          );
          console.log(JSON.stringify(result.guardReport, null, 2));
          NODE

      - name: Generate the non-blocking classification analysis
        if: inputs.mode == 'full' && steps.current.outputs.already_current != 'true'
        id: classification
        working-directory: ${{ runner.temp }}/momiji2
        env:
          INCOMING_MANIFEST: ${{ steps.crawl.outputs.manifest_path }}
        run: |
          artifact="$RUNNER_TEMP/classification-diff.json"
          node scripts/classification-diff.mjs \
            data/subjectDataManifest.json "$INCOMING_MANIFEST" > "$artifact"
          echo "artifact_path=$artifact" >> "$GITHUB_OUTPUT"

      - name: Prepare the verified history update
        if: inputs.mode == 'full' && steps.current.outputs.already_current != 'true'
        id: history
        run: |
          python -m scripts.prepare_consumer_history \
            --consumer-data-dir "$RUNNER_TEMP/momiji2/data" \
            --incoming-manifest "${{ steps.crawl.outputs.manifest_path }}" \
            --classification-artifact "${{ steps.classification.outputs.artifact_path }}" \
            --update-kind "${{ inputs.update_kind }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Import, generate, and verify the consumer update
        if: inputs.mode == 'full' && steps.current.outputs.already_current != 'true'
        working-directory: ${{ runner.temp }}/momiji2
        env:
          MANIFEST_PATH: ${{ steps.crawl.outputs.manifest_path }}
          DEPARTMENTS_PATH: ${{ steps.crawl.outputs.departments_path }}
          DATA_FILE: ${{ steps.crawl.outputs.data_file }}
          HISTORY_INDEX: ${{ steps.history.outputs.indexRelativePath }}
          PREVIOUS_HISTORY_INDEX: ${{ steps.history.outputs.previousIndexRelativePath }}
          HISTORY_ARTIFACT: ${{ steps.history.outputs.artifactRelativePath }}
          CLASSIFICATION_ARTIFACT: ${{ steps.history.outputs.classificationRelativePath }}
          OBSOLETE_DATA_FILE: ${{ steps.history.outputs.obsoleteDataFile }}
        run: |
          pnpm import:harvester-generation --manifest "$MANIFEST_PATH" --departments "$DEPARTMENTS_PATH"
          if test -n "$OBSOLETE_DATA_FILE"; then
            rm -- "data/$OBSOLETE_DATA_FILE"
          fi
          pnpm generate:subject-constants
          pnpm validate:data
          pnpm check:subject-constants
          pnpm test:update-guard
          pnpm test:import-harvester-generation
          pnpm test:subject-constants
          pnpm test:data-validator
          pnpm test:raw-subject-contract
          pnpm exec tsc --noEmit
          pnpm prebuild
          history_args=(--history-path "$HISTORY_INDEX")
          paths=("data/$DATA_FILE" "$HISTORY_INDEX")
          if test -n "$PREVIOUS_HISTORY_INDEX"; then
            history_args+=(--history-path "$PREVIOUS_HISTORY_INDEX")
            paths+=("$PREVIOUS_HISTORY_INDEX")
          fi
          if test -n "$HISTORY_ARTIFACT"; then
            history_args+=(--history-path "$HISTORY_ARTIFACT")
            paths+=("$HISTORY_ARTIFACT")
          fi
          if test -n "$CLASSIFICATION_ARTIFACT"; then
            history_args+=(--history-path "$CLASSIFICATION_ARTIFACT")
            paths+=("$CLASSIFICATION_ARTIFACT")
          fi
          if test -n "$OBSOLETE_DATA_FILE"; then
            history_args+=(--obsolete-data-file "$OBSOLETE_DATA_FILE")
            paths+=("data/$OBSOLETE_DATA_FILE")
          fi
          python "$GITHUB_WORKSPACE/scripts/validate_consumer_update_diff.py" \
            --consumer . --data-file "$DATA_FILE" "${history_args[@]}"
          git add --intent-to-add -- "${paths[@]}" \
            data/subjectDataManifest.json data/department_constants.json \
            data/subject_structure.json \
            data/derivedSubjectConstants.json src/types/subjectConstants.ts \
            src/subject/activeSubjectData.ts src/types/rawSubjectProperties.ts
          git diff --check
          pnpm exec vite build --outDir "$RUNNER_TEMP/momiji2-vite"

      - name: Verify an existing branch has the same generation
        if: inputs.mode == 'full' && steps.current.outputs.already_current != 'true' && steps.target.outputs.branch_exists == 'true'
        working-directory: ${{ runner.temp }}/momiji2
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
          DATA_FILE: ${{ steps.crawl.outputs.data_file }}
          DATA_SHA256: ${{ steps.crawl.outputs.data_sha256 }}
          MANIFEST_PATH: ${{ steps.crawl.outputs.manifest_path }}
          HISTORY_INDEX: ${{ steps.history.outputs.indexRelativePath }}
          PREVIOUS_HISTORY_INDEX: ${{ steps.history.outputs.previousIndexRelativePath }}
          HISTORY_ARTIFACT: ${{ steps.history.outputs.artifactRelativePath }}
          CLASSIFICATION_ARTIFACT: ${{ steps.history.outputs.classificationRelativePath }}
          OBSOLETE_DATA_FILE: ${{ steps.history.outputs.obsoleteDataFile }}
        run: |
          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git cat-file -e "origin/$BRANCH:data/$DATA_FILE"
          git show "origin/$BRANCH:data/$DATA_FILE" > "$RUNNER_TEMP/existing-generation.json"
          test "$(sha256sum "$RUNNER_TEMP/existing-generation.json" | cut -d ' ' -f 1)" = "$DATA_SHA256"
          git show "origin/$BRANCH:data/subjectDataManifest.json" > "$RUNNER_TEMP/existing-manifest.json"
          python - "$MANIFEST_PATH" "$RUNNER_TEMP/existing-manifest.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              expected = json.load(source)
          with open(sys.argv[2], encoding="utf-8") as source:
              actual = json.load(source)
          fields = (
              "schemaVersion", "dataFile", "academicYear", "retrievedAt",
              "subjectCount", "source", "structureReport",
          )
          if any(actual.get(field) != expected.get(field) for field in fields):
              raise SystemExit("existing branch manifest does not match the incoming generation")
          PY
          git show "origin/$BRANCH:$HISTORY_INDEX" > "$RUNNER_TEMP/existing-history-index.json"
          cmp "$HISTORY_INDEX" "$RUNNER_TEMP/existing-history-index.json"
          history_args=(--history-path "$HISTORY_INDEX")
          if test -n "$PREVIOUS_HISTORY_INDEX"; then
            git show "origin/$BRANCH:$PREVIOUS_HISTORY_INDEX" > "$RUNNER_TEMP/existing-previous-history-index.json"
            cmp "$PREVIOUS_HISTORY_INDEX" "$RUNNER_TEMP/existing-previous-history-index.json"
            history_args+=(--history-path "$PREVIOUS_HISTORY_INDEX")
          fi
          if test -n "$HISTORY_ARTIFACT"; then
            git show "origin/$BRANCH:$HISTORY_ARTIFACT" > "$RUNNER_TEMP/existing-history-artifact.json"
            cmp "$HISTORY_ARTIFACT" "$RUNNER_TEMP/existing-history-artifact.json"
            history_args+=(--history-path "$HISTORY_ARTIFACT")
          fi
          if test -n "$CLASSIFICATION_ARTIFACT"; then
            git show "origin/$BRANCH:$CLASSIFICATION_ARTIFACT" > "$RUNNER_TEMP/existing-classification-artifact.json"
            cmp "$CLASSIFICATION_ARTIFACT" "$RUNNER_TEMP/existing-classification-artifact.json"
            history_args+=(--history-path "$CLASSIFICATION_ARTIFACT")
          fi
          if test -n "$OBSOLETE_DATA_FILE"; then
            history_args+=(--obsolete-data-file "$OBSOLETE_DATA_FILE")
          fi
          python "$GITHUB_WORKSPACE/scripts/validate_consumer_update_diff.py" \
            --consumer . --data-file "$DATA_FILE" \
            --base-ref origin/develop --head-ref "origin/$BRANCH" \
            "${history_args[@]}"
          git worktree add --detach "$RUNNER_TEMP/momiji2-existing" "origin/$BRANCH"
          cd "$RUNNER_TEMP/momiji2-existing"
          pnpm install --frozen-lockfile
          pnpm validate:data
          pnpm check:subject-constants
          pnpm exec tsc --noEmit
          pnpm prebuild
          pnpm exec vite build --outDir "$RUNNER_TEMP/momiji2-existing-vite"

      - name: Create a scoped momiji2 App token
        if: inputs.mode == 'full' && steps.current.outputs.already_current != 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MOMIJI2_UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.MOMIJI2_UPDATER_PRIVATE_KEY }}
          owner: swawa-yu
          repositories: momiji2
          permission-contents: write
          permission-pull-requests: write

      - name: Reuse an open matching pull request
        if: inputs.mode == 'full' && steps.current.outputs.already_current != 'true' && steps.target.outputs.branch_exists == 'true'
        id: existing-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          url="$(gh pr list --repo swawa-yu/momiji2 --base develop --head "$BRANCH" \
            --state open --json url --jq '.[0].url')"
          if test -n "$url"; then
            echo "open_pr=true" >> "$GITHUB_OUTPUT"
            echo "Existing pull request: $url"
          else
            echo "open_pr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop for a previously closed matching pull request
        if: inputs.mode == 'full' && steps.current.outputs.already_current != 'true' && steps.target.outputs.branch_exists == 'true' && steps.existing-pr.outputs.open_pr != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          url="$(gh pr list --repo swawa-yu/momiji2 --base develop --head "$BRANCH" \
            --state closed --json url --jq '.[0].url')"
          if test -n "$url"; then
            echo "A matching pull request was previously closed: $url" >&2
            echo "Resolve it manually; this workflow will not reopen or replace it." >&2
            exit 1
          fi

      - name: Commit and push a new update branch
        if: inputs.mode == 'full' && steps.current.outputs.already_current != 'true' && steps.target.outputs.branch_exists != 'true'
        working-directory: ${{ runner.temp }}/momiji2
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
          YEAR: ${{ steps.crawl.outputs.year }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          HISTORY_INDEX: ${{ steps.history.outputs.indexRelativePath }}
          PREVIOUS_HISTORY_INDEX: ${{ steps.history.outputs.previousIndexRelativePath }}
          HISTORY_ARTIFACT: ${{ steps.history.outputs.artifactRelativePath }}
          CLASSIFICATION_ARTIFACT: ${{ steps.history.outputs.classificationRelativePath }}
          OBSOLETE_DATA_FILE: ${{ steps.history.outputs.obsoleteDataFile }}
        run: |
          git switch -c "$BRANCH"
          bot_id="$(GH_TOKEN="$APP_TOKEN" gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          paths=("data/${{ steps.crawl.outputs.data_file }}" "$HISTORY_INDEX")
          if test -n "$PREVIOUS_HISTORY_INDEX"; then
            paths+=("$PREVIOUS_HISTORY_INDEX")
          fi
          if test -n "$HISTORY_ARTIFACT"; then
            paths+=("$HISTORY_ARTIFACT")
          fi
          if test -n "$CLASSIFICATION_ARTIFACT"; then
            paths+=("$CLASSIFICATION_ARTIFACT")
          fi
          if test -n "$OBSOLETE_DATA_FILE"; then
            paths+=("data/$OBSOLETE_DATA_FILE")
          fi
          git add -- "${paths[@]}" \
            data/subjectDataManifest.json data/department_constants.json \
            data/subject_structure.json \
            data/derivedSubjectConstants.json src/types/subjectConstants.ts \
            src/subject/activeSubjectData.ts src/types/rawSubjectProperties.ts
          git diff --cached --check
          git diff --cached --quiet && { echo 'No consumer changes to commit.'; exit 1; }
          git commit -m "data: import ${YEAR} syllabus generation"
          auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push origin "$BRANCH"
          unset auth

      - name: Create the consumer update pull request
        if: inputs.mode == 'full' && steps.current.outputs.already_current != 'true' && (steps.target.outputs.branch_exists != 'true' || steps.existing-pr.outputs.open_pr != 'true')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.target.outputs.branch }}
          YEAR: ${{ steps.crawl.outputs.year }}
          RETRIEVED_AT: ${{ steps.crawl.outputs.retrieved_at }}
          SUBJECT_COUNT: ${{ steps.crawl.outputs.subject_count }}
          DATA_SHA256: ${{ steps.crawl.outputs.data_sha256 }}
          GUARD_REPORT_PATH: ${{ runner.temp }}/update-guard-report.json
          HISTORY_MODE: ${{ steps.history.outputs.mode }}
        run: |
          body_path="$RUNNER_TEMP/momiji2-update-pr.md"
          python - "$body_path" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          report = json.loads(Path(os.environ["GUARD_REPORT_PATH"]).read_text())
          analysis = report.get("analysis", [])
          analysis_lines = (
              "\n".join(f"- {item}" for item in analysis)
              if analysis else "- 集合の増減なし"
          )
          body = f"""MomijiHarvester2026の手動実行から生成した更新です。

          - 年度: {os.environ["YEAR"]}
          - 取得日: {os.environ["RETRIEVED_AT"]}
          - 科目数: {os.environ["SUBJECT_COUNT"]}
          - 科目データSHA-256: {os.environ["DATA_SHA256"]}
          - 更新guard: hard failure 0件、要確認事項 0件
          - 履歴更新モード: {os.environ["HISTORY_MODE"]}

          ## 値集合の変化（分析情報）

          {analysis_lines}

          このworkflowはPRを自動mergeしません。
          """
          Path(sys.argv[1]).write_text(body, encoding="utf-8")
          PY
          gh pr create --repo swawa-yu/momiji2 --base develop --head "$BRANCH" --draft \
            --title "data: ${YEAR}年度シラバス生成物を更新" \
            --body-file "$body_path"
